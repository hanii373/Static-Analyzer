name: "Application Security Guard"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze:
    name: Structural Code Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install System and Parser Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3-dev
        pip install --upgrade pip
        pip install tree-sitter==0.23.2 tree-sitter-python==0.23.2 aiohttp beautifulsoup4 google-genai

    - name: Execute Security Analysis Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        # The '|| true' ensures that finding structural vulnerabilities doesn't crash the workflow
        python3 -m sast_tool.cli --path . --format json || true

    - name: Upload Results to GitHub Security Tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: results.sarif
